<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Web Page</title>
    <style>
        /* Reset styles */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Arial', sans-serif;
            color: white;
            background-color: #121212;
            height: 100%;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background-color: rgba(30, 30, 30, 0.9);
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 100;
        }

        header .logo img {
            width: 150px;
        }

        nav ul {
            list-style-type: none;
            display: flex;
        }

        nav ul li {
            margin: 0 15px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        /* Hero section */
        .hero {
            position: relative;
            text-align: center;
            height: 100vh;
            width: 100%;
        }

        .hero-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(50%);
        }

        .hero-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.7);
            z-index: 200;
        }

        .hero-text h1 {
            font-size: 4rem;
            margin-bottom: 10px;
            font-family: 'Arial', sans-serif;
        }

        .hero-text h2 {
            font-size: 2rem;
            margin-bottom: 30px;
            font-family: 'Arial', sans-serif;
        }

        /* Buttons */
        .download-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .download-buttons a {
            padding: 15px 30px;
            background-color: #1e90ff;
            color: white;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            text-transform: uppercase;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .download-buttons a:hover {
            background-color: #0056b3;
            transform: translateY(-2px);
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 20px;
            background-color: rgba(30, 30, 30, 0.9);
            font-size: 0.9rem;
            position: relative;
        }

        /* Social Icons */
        .social-icons a {
            color: white;
            text-decoration: none;
            margin: 0 10px;
        }

        /* Responsive styles */
        @media (max-width: 768px) {
            .hero-text h1 {
                font-size: 3rem;
            }

            .hero-text h2 {
                font-size: 1.5rem;
            }

            .download-buttons a {
                padding: 12px 25px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <img src="logo.png" alt="Logo">
        </div>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>

    <section class="hero">
        <div class="hero-image">
            <!-- Replace with your background image -->
            <img src="hero-image.jpg" alt="Hero Image" class="hero-image">
        </div>
        <div class="hero-text">
            <h1>Welcome to My Website</h1>
            <h2>Your tagline goes here</h2>
            <div class="download-buttons">
                <a href="#">Download</a>
                <a href="#">Learn More</a>
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2025 My Web Page. All rights reserved.</p>
        <div class="social-icons">
            <a href="#">Facebook</a>
            <a href="#">Twitter</a>
            <a href="#">Instagram</a>
        </div>
    </footer>
</body>
</html>
